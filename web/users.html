<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users — UnderSoil Admin</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/modals.css">
</head>

<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <img src="assets/mark.svg" alt="">
      <span class="brand-word">
        UnderSoil<span class="brand-sub">Admin</span>
      </span>
    </div>

    <nav class="nav">
      <a href="dashboard.html">
        <span class="nav-dot"></span>Farm overview
      </a>
      <a href="sectors.html">
        <span class="nav-dot"></span>Sectors &amp; crops
      </a>
      <a href="devices.html">
        <span class="nav-dot"></span>Devices
      </a>
      <a href="users.html" class="active">
        <span class="nav-dot"></span>Users
      </a>
      <a href="reports.html">
        <span class="nav-dot"></span>Reports
      </a>
    </nav>

    <div class="sidebar-foot">
      <span class="who" id="sidebar-user-name">Loading...</span>
      Farm administrator
      <br>
      <a href="#" onclick="logout(); return false;">Sign out</a>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">

    <div class="topline">
      <div>
        <h1>Users</h1>
        <p id="user-count">Loading users...</p>
      </div>

      <button class="btn-primary" type="button" id="add-user-btn">+ Add user</button>
    </div>

    <!-- Users table -->
    <div class="card">
      <h2>All users</h2>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="users-table-body">
          <tr>
            <td colspan="4">Loading users...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- Add/Edit user modal -->
<div class="modal-overlay" id="user-modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="form-title">
    <div class="modal-head">
      <h2 id="form-title">Add user</h2>
      <button type="button" class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
    </div>

    <form id="user-form" novalidate>
      <input type="hidden" id="u-id">

      <div class="form-grid">
        <div class="field">
          <label for="u-name">Full name</label>
          <input
            id="u-name"
            type="text"
            placeholder="e.g. Nomvula Khumalo"
            autocomplete="name"
            required>
        </div>

        <div class="field">
          <label for="u-role">Role</label>
          <select id="u-role" required>
            <option value="Farmer">Farmer</option>
            <option value="Admin">Admin</option>
          </select>
        </div>

        <div class="field">
          <label for="u-email">Email address</label>
          <input
            id="u-email"
            type="email"
            placeholder="name@example.com"
            autocomplete="email"
            required>
        </div>

        <div class="field">
          <label for="u-password">Password</label>
          <input
            id="u-password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="At least 8 characters">
          <small>
            Required when adding a user. When editing, leave blank
            to keep the current password.
          </small>
        </div>
      </div>

      <p id="form-message" class="form-message" role="alert" aria-live="assertive"></p>

      <div class="form-actions">
        <button class="btn-primary" type="submit" id="save-user-btn">
          Save user
        </button>
        <button class="btn-quiet" type="button" id="cancel-user-form">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="confirm-modal-overlay" hidden>
  <div class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-head">
      <h2 id="confirm-title">Remove user</h2>
      <button type="button" class="modal-close" id="confirm-close-btn" aria-label="Close">&times;</button>
    </div>
    <p id="confirm-message"></p>
    <div class="form-actions">
      <button class="btn-danger" type="button" id="confirm-delete-btn">Remove</button>
      <button class="btn-quiet" type="button" id="cancel-delete-btn">Cancel</button>
    </div>
  </div>
</div>

<!-- Toast notifications -->
<div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

<!-- Existing authentication script -->
<script src="js/auth.js"></script>

<!-- Check admin session -->
<script>
  (function () {
    const session = requireAdminSession();

    if (session) {
      document.getElementById('sidebar-user-name').textContent =
        session.user.name || 'Administrator';
    }
  })();
</script>

<!-- User management functionality -->
<script src="js/users.js"></script>

</body>
</html>
