<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — UnderSoil Admin</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-panel">
      <div class="brand">
        <img src="assets/mark.svg" alt="">
        <span class="brand-word">UnderSoil</span>
      </div>
      <div class="login-copy">
        <h1>Every plot, every sensor, one screen.</h1>
        <p>Keep track of crop health, water flow and field devices across the farm from the admin dashboard.</p>
      </div>
      <div class="foot">AgriCoders · UnderSoil Admin</div>
    </div>
    <div class="login-form-side">
      <form class="login-form" action="#" onsubmit="return false;">
        <h2>Welcome back</h2>
        <p class="sub">Sign in to view the farm and manage user accounts.</p>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@undersoil.farm" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" required>
        </div>
        <button class="btn-primary" type="submit">Sign in</button>
        <p class="alt">Forgot your password? Ask your farm administrator.</p>
      </form>
    </div>
  </div>
</body>
</html>
